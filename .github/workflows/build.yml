name: Build GAT Exam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor/splash-screen@^6.0.0
          npm install -D @capacitor/cli@^6.0.0 @capacitor/assets

      - name: Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.gatexam.app",
            "appName": "GAT Exam",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["gatexam.lovestoblog.com", "*.lovestoblog.com"]
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "launchAutoHide": true,
                "launchFadeOutDuration": 400,
                "backgroundColor": "#0b1020",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          EOF

      - name: Generate logo, icons and splash images
        run: |
          pip install --break-system-packages pillow
          mkdir -p assets www
          python3 - << 'PY'
          import os
          from PIL import Image, ImageDraw

          S = 1024
          C1 = (37, 99, 235)
          C2 = (99, 70, 229)

          def grad(size, c1, c2):
              img = Image.new("RGB", (size, size), c1)
              px = img.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2 * size - 2)
                      px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))
              return img.convert("RGBA")

          def draw_mark(size):
              m = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(m)
              k = size / 1024.0
              def P(pts):
                  return [(x * k, y * k) for x, y in pts]
              # cap base
              d.polygon(P([(352, 490), (512, 562), (672, 490), (672, 630), (512, 705), (352, 630)]), fill=(199, 216, 255, 255))
              # cap top
              d.polygon(P([(512, 290), (810, 430), (512, 570), (214, 430)]), fill=(255, 255, 255, 255))
              # tassel
              d.line([(780 * k, 445 * k), (780 * k, 600 * k)], fill=(255, 255, 255, 255), width=int(14 * k))
              d.ellipse([(758 * k, 590 * k), (802 * k, 634 * k)], fill=(255, 255, 255, 255))
              return m

          def fit(img, frac, canvas):
              bb = img.getbbox()
              img = img.crop(bb)
              scale = canvas * frac / max(img.size)
              img = img.resize((int(img.width * scale), int(img.height * scale)), Image.LANCZOS)
              c = Image.new("RGBA", (canvas, canvas), (0, 0, 0, 0))
              c.paste(img, ((canvas - img.width) // 2, (canvas - img.height) // 2), img)
              return c

          def rounded(img, r):
              m = Image.new("L", img.size, 0)
              ImageDraw.Draw(m).rounded_rectangle([0, 0, img.width - 1, img.height - 1], r, fill=255)
              out = img.convert("RGBA")
              out.putalpha(m)
              return out

          if os.path.exists("icon.png"):
              src = Image.open("icon.png").convert("RGBA").resize((S, S), Image.LANCZOS)
              icon_only = src
              fg = fit(src, 0.62, S)
              bg = Image.new("RGBA", (S, S), (15, 23, 42, 255))
          else:
              base = grad(S, C1, C2)
              mark = draw_mark(S)
              icon_only = base.copy()
              icon_only.alpha_composite(fit(mark, 0.60, S))
              fg = fit(mark, 0.60, S)
              bg = base

          tile = rounded(icon_only, int(S * 0.22))

          icon_only.save("assets/icon-only.png")
          fg.save("assets/icon-foreground.png")
          bg.save("assets/icon-background.png")

          for name in ("splash.png", "splash-dark.png"):
              canvas = Image.new("RGBA", (2732, 2732), (11, 16, 32, 255))
              t = tile.resize((620, 620), Image.LANCZOS)
              canvas.paste(t, ((2732 - 620) // 2, (2732 - 620) // 2), t)
              canvas.save("assets/" + name)

          tile.resize((512, 512), Image.LANCZOS).save("www/logo.png")
          PY

      - name: Loading page (www/index.html)
        run: |
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="am">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>GAT Exam</title>
          <style>
            *{box-sizing:border-box;margin:0;padding:0}
            html,body{height:100%;background:#0b1020;color:#f1f5f9;overflow:hidden;
              font-family:-apple-system,Roboto,"Noto Sans Ethiopic","Nyala",sans-serif}
            #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
              justify-content:center;text-align:center;padding:32px 24px;position:relative}
            .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
            .g1{width:340px;height:340px;background:radial-gradient(circle,rgba(37,99,235,.6),transparent 70%);top:-90px;left:-70px;animation:d1 9s ease-in-out infinite}
            .g2{width:320px;height:320px;background:radial-gradient(circle,rgba(99,70,229,.55),transparent 70%);bottom:-110px;right:-80px;animation:d2 11s ease-in-out infinite}
            @keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,40px) scale(1.15)}}
            @keyframes d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-30px) scale(1.12)}}
            .ring{position:absolute;width:150px;height:150px;border-radius:50%;
              border:1px solid rgba(59,130,246,.45);animation:ring 2.4s ease-out infinite}
            .ring.r2{animation-delay:1.2s}
            @keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
            .logo{width:112px;height:112px;border-radius:26px;position:relative;z-index:2;
              box-shadow:0 18px 40px rgba(37,99,235,.45);opacity:0;transform:translateY(-20px) scale(.85);
              animation:drop .8s cubic-bezier(.22,1,.36,1) .1s forwards}
            @keyframes drop{to{opacity:1;transform:none}}
            h1{font-size:26px;font-weight:800;letter-spacing:.5px;margin-top:26px;position:relative;z-index:2;
              opacity:0;filter:blur(6px);transform:translateY(10px);animation:focus .7s ease .6s forwards}
            h1 span{background:linear-gradient(135deg,#60a5fa,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
            @keyframes focus{to{opacity:1;filter:none;transform:none}}
            .tag{font-size:11px;font-weight:600;letter-spacing:3px;color:#94a3b8;text-transform:uppercase;
              margin-top:10px;position:relative;z-index:2;opacity:0;animation:fade .6s ease .95s forwards}
            @keyframes fade{to{opacity:1}}
            .track{width:170px;height:4px;border-radius:4px;background:rgba(148,163,184,.18);overflow:hidden;
              margin-top:34px;position:relative;z-index:2;opacity:0;animation:fade .5s ease 1.1s forwards}
            .fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#2563eb,#6366f1,#60a5fa);
              animation:load 2.6s cubic-bezier(.4,0,.2,1) 1.1s forwards}
            @keyframes load{to{width:100%}}
            #status{color:#94a3b8;font-size:12.5px;margin-top:14px;min-height:18px;position:relative;z-index:2;
              opacity:0;animation:fade .5s ease 1.3s forwards}
            #offline{display:none;position:relative;z-index:3;margin-top:26px}
            #offline p{color:#cbd5e1;font-size:14px;line-height:1.6;margin-bottom:16px}
            #offline button{background:linear-gradient(135deg,#2563eb,#6366f1);color:#fff;border:0;
              padding:12px 30px;border-radius:12px;font-size:15px;font-weight:600}
            @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
          </style>
          </head>
          <body>
          <div id="wrap">
            <div class="glow g1"></div>
            <div class="glow g2"></div>
            <div class="ring"></div>
            <div class="ring r2"></div>
            <img class="logo" src="logo.png" alt="GAT Exam">
            <h1>GAT <span>Exam</span></h1>
            <div class="tag">Prepare. Practice. Pass.</div>
            <div class="track"><div class="fill"></div></div>
            <div id="status">በመጫን ላይ... / Loading...</div>
            <div id="offline">
              <p>የኢንተርኔት ግንኙነት የለም<br>No internet connection</p>
              <button onclick="start()">እንደገና ሞክር / Retry</button>
            </div>
          </div>
          <script>
            var URL_GO = 'https://gatexam.lovestoblog.com/login';
            var msgs = ['በመጫን ላይ... / Loading...', 'ደህንነት በማረጋገጥ ላይ... / Securing...', 'ዝግጁ ነው... / Almost ready...'];
            var timer;
            function start(){
              document.getElementById('offline').style.display = 'none';
              document.querySelector('.track').style.display = 'block';
              var s = document.getElementById('status');
              s.style.display = 'block';
              var i = 0;
              s.textContent = msgs[0];
              clearInterval(timer);
              timer = setInterval(function(){ i = (i + 1) % msgs.length; s.textContent = msgs[i]; }, 1100);
              setTimeout(function(){
                if (navigator.onLine === false) {
                  clearInterval(timer);
                  s.style.display = 'none';
                  document.querySelector('.track').style.display = 'none';
                  document.getElementById('offline').style.display = 'block';
                } else {
                  location.replace(URL_GO);
                }
              }, 3000);
            }
            start();
          </script>
          </body>
          </html>
          EOF

      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android icons and splash
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0b1020' \
            --iconBackgroundColorDark '#0b1020' \
            --splashBackgroundColor '#0b1020' \
            --splashBackgroundColorDark '#0b1020'

      - name: Write MainActivity
        run: |
          FILE=$(find android -name MainActivity.java)
          PKG=$(head -n 1 "$FILE")
          cat > "$FILE" << JAVAEOF
          $PKG

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private boolean backOnce = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // ስክሪንሾት እና screen recording መከልከል
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE);

                  getWindow().setStatusBarColor(0xFF0B1020);
                  getWindow().setNavigationBarColor(0xFF0B1020);

                  WebView wv = this.bridge.getWebView();
                  if (wv != null) {
                      WebSettings s = wv.getSettings();
                      s.setSupportZoom(false);
                      s.setBuiltInZoomControls(false);
                      s.setDisplayZoomControls(false);
                      s.setTextZoom(100);
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                      wv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                      WebView.setWebContentsDebuggingEnabled(false);
                      wv.setOnLongClickListener(v -> {
                          WebView.HitTestResult r = wv.getHitTestResult();
                          return r == null || r.getType() != WebView.HitTestResult.EDIT_TEXT_TYPE;
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  WebView wv = this.bridge.getWebView();
                  if (wv != null && wv.canGoBack()) { wv.goBack(); return; }
                  if (backOnce) { super.onBackPressed(); return; }
                  backOnce = true;
                  Toast.makeText(this, "ለመውጣት ደግመው ይንኩ / Tap again to exit", Toast.LENGTH_SHORT).show();
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> backOnce = false, 2000);
              }
          }
          JAVAEOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gatexam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
